# Plugin Language
# The plugin will look for files in /messages/<language>.yml
# Available by default: en, es, pt, ja, ru
language: en

# Prefix for all messages
prefix: "&8[&bX-SetWarps&8] &7"

# Metrics / bStats
# Anonymous usage statistics to help improve the plugin.
# Data collected: server version, player count, plugin version, warp count, config options.
# No personal or sensitive data is collected. You can opt-out at any time.
metrics:
  enabled: true

# Update Checker System
updates:
  # Check for updates when the plugin starts?
  check: true
  # Notify administrators (with xsetwarps.admin) when they join if an update is available?
  notify-on-join: true

# Command Settings
commands:
  # Should the help message be displayed if a command is used incorrectly?
  help-message: true

# Warp Settings
warps:
  # Maximum number of warps allowed on the server.
  # Set to -1 for unlimited.
  max-warps: -1
  
  # Enable individual permissions for each warp?
  # Permission node: xsetwarps.warp.<name>
  # If false, players only need xsetwarps.warp to access warps without custom permission.
  # IMPORTANT: Warps with a custom 'permission' field in warps.yml are ALWAYS
  # protected by that permission, regardless of this setting.
  per-warp-permission: false

  # Warps with empty permission (permission: '') are accessible to everyone?
  # true  = permission: '' means anyone with xsetwarps.warp can use it (public)
  # false = permission: '' means players need xsetwarps.warp.<name> per-warp permission
  empty-permission-public: true

# Teleport Settings
teleport:
  # Cooldown in seconds between uses of the SAME warp.
  # Set to 0 to disable cooldown.
  cooldown: 0
  
  # Global cooldown in seconds between ANY warp use.
  # This applies regardless of which warp is used.
  # Set to 0 to disable global cooldown.
  global-cooldown: 0
  
  # Delay in seconds before the teleport takes effect.
  # Set to 0 to teleport instantly.
  delay: 0
  
  # Cancel the teleport delay if the player moves?
  cancel-on-move: true
  
  # Movement tolerance.
  # 0.1 is very sensitive (even looking around might cancel it).
  # Increase this if you want players to be able to look around.
  move-tolerance: 0.5

  # Teleport Effects (Sounds)
  effects:
    # Enable teleport effects?
    enabled: true
    
    # Sound settings
    sound:
      enabled: true
      # Sound to play. Uses XSound for cross-version compatibility.
      # Examples: ENTITY_ENDERMAN_TELEPORT, ENDERMAN_TELEPORT, ENTITY_PLAYER_LEVELUP
      name: "ENTITY_ENDERMAN_TELEPORT"
      volume: 1.0
      pitch: 1.0

# GUI Settings
gui:
  # Enable the GUI for warps? (Players will see a menu instead of text list)
  enabled: true