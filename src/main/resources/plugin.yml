name: X-SetWarps
version: 1.3
main: com.fabian.xsetwarps.XSetWarps
author: Fabian
description: Advanced warp plugin with GUI support and multi-file warps. Supports Minecraft 1.8.8+ (uses XSeries for cross-version material/sound compatibility).
softdepend: [PlaceholderAPI, Essentials, CMI]
folia-supported: true

commands:
  xsetwarp:
    description: Main command for X-SetWarps
    aliases: [xsw]
    permission: xsetwarps.admin
  setwarp:
    description: Create a new warp
    permission: xsetwarps.setwarp
  warp:
    description: Teleport to a warp
    permission: xsetwarps.warp
  delwarp:
    description: Delete an existing warp
    permission: xsetwarps.delwarp
  warps:
    description: List all warps or open GUI
    aliases: [warpgui]
    permission: xsetwarps.warps
  warpinfo:
    description: Show information about a warp
    permission: xsetwarps.warpinfo

permissions:
  xsetwarps.*:
    description: All permissions for X-SetWarps
    children:
      xsetwarps.admin: true
      xsetwarps.setwarp: true
      xsetwarps.warp: true
      xsetwarps.warp.*: true
      xsetwarps.delwarp: true
      xsetwarps.warps: true
      xsetwarps.warpgui: true
      xsetwarps.warpinfo: true
      xsetwarps.bypass-limit: true
      xsetwarps.bypass-cooldown: true
      xsetwarps.export: true
      xsetwarps.import: true
  xsetwarps.admin:
    description: Permission to use admin commands (reload, update, version, locate, setwarpcooldown, help)
    default: op
    children:
      xsetwarps.setwarp: true
      xsetwarps.delwarp: true
      xsetwarps.warpinfo: true
      xsetwarps.warp.*: true
      xsetwarps.bypass-cooldown: true
      xsetwarps.export: true
      xsetwarps.import: true
  xsetwarps.export:
    description: Permission to export warps to a YAML file (/xsetwarp export <file> [identifier])
    default: op
  xsetwarps.import:
    description: Permission to import warps from files or other plugins (/xsetwarp import <file|essentials|cmi|all>)
    default: op
  xsetwarps.setwarp:
    description: Permission to set warps
    default: op
  xsetwarps.warp:
    description: Permission to use basic warp command
    default: true
  xsetwarps.warp.*:
    description: Permission to use ALL warps (bypasses per-warp permissions)
    default: op
  xsetwarps.delwarp:
    description: Permission to delete warps
    default: op
  xsetwarps.warps:
    description: Permission to list warps
    default: true
  xsetwarps.warpgui:
    description: Permission to open the warp GUI
    default: true
  xsetwarps.warpinfo:
    description: Permission to see warp info
    default: true
  xsetwarps.bypass-cooldown:
    description: Permission to bypass all warp cooldowns (per-warp and global)
    default: op
  xsetwarps.bypass-limit:
    description: Permission to bypass warp limit
    default: op