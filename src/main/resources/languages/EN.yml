# X-SetWarps Language File
# You can customize all messages here.
# Supports color codes (&a, &b, etc.) and HEX colors if using a compatible server.

# General Messages
prefix: "&8[&bX-SetWarps&8] &7"
no-permission: "%prefix%&cYou do not have permission to use this command."
only-players: "%prefix%&cThis command can only be used by players."
usage-setwarp: "%prefix%&cUsage: /setwarp <name> [description]"
usage-warp: "%prefix%&cUsage: /warp <name>"
usage-delwarp: "%prefix%&cUsage: /delwarp <name>"
usage-warpinfo: "%prefix%&cUsage: /warpinfo <name>"

# Warp Messages
warp-set: "%prefix%&aWarp '&b%warp%&a' has been set successfully!"
warp-not-found: "%prefix%&cWarp '&b%warp%&c' does not exist."
warp-teleport: "%prefix%&aTeleported to warp: &b%warp%"
warp-deleted: "%prefix%&aWarp '&b%warp%&a' has been successfully deleted."
world-not-loaded: "%prefix%&cError: World '&b%world%&c' is not loaded."
reload-success: "%prefix%&aConfiguration and languages reloaded successfully!"

# New Feature Messages
warp-cooldown: "%prefix%&cYou must wait &e%seconds%s &cbefore using &b%warp% &cagain."
warp-delay: "%prefix%&eTeleporting to &b%warp% &ein &a%seconds% &eseconds... Don't move."
warp-delay-cancelled: "%prefix%&cTeleportation cancelled due to movement."
warps-limit-reached: "%prefix%&cMaximum warp limit reached (&e%limit%&c)."
warps-list-empty: "%prefix%&cThere are no warps registered currently."
warps-list-header: "&9&l--- Warps List (&b%count%&9) ---"
warps-list-entry: "&7- &b%warp% &8(&7World: &f%world%&8) &7- &f%desc%"

# WarpInfo Messages
warpinfo-header: "&9&l--- Warp Info: &b%warp% &9&l---"
warpinfo-desc: "&7Description: &f%desc%"
warpinfo-world: "&7World: &f%world%"
warpinfo-coords: "&7Coordinates: &f%coords%"
warpinfo-creator: "&7Created by: &f%creator%"
warpinfo-created: "&7Date: &f%date%"

# Update Checker Messages
update-check: "%prefix%&eChecking for updates..."
update-available: "%prefix%&eA new version is available! &7(&c%current%&7 -> &a%latest%&7)"
update-download: "%prefix%&eDownload: &b%url%"
update-current: "%prefix%&aYou are using the latest version!"
update-error: "%prefix%&cError checking for updates. Please try again later."
version-info: "%prefix%&bX-SetWarps version: &a%version%"

# Help Messages
help-header: "&9&l--- X-SetWarps Help ---"
help-reload: "&b/xsw reload &f- Reload the plugin"
help-update: "&b/xsw update &f- Check for updates"
help-version: "&b/xsw version &f- Show plugin version"
help-setwarp: "&b/setwarp <name> [desc] &f- Create a warp"
help-warp: "&b/warp <name> &f- Teleport to a warp"
help-delwarp: "&b/delwarp <name> &f- Delete a warp"
help-warps: "&b/warps &f- List all warps"
help-warpinfo: "&b/warpinfo <name> &f- Detailed info about a warp"

# Language Messages
language-changed: "%prefix%&aLanguage changed to: &b%language%"
language-not-found: "%prefix%&cLanguage not found. Available: %list%"
language-list: "&aAvailable: &f%list%"

# Locate Command
help-locate: "&b/xsw locate <lang> &f- Change language"

# Export/Import Messages
usage-export: "%prefix%&cUsage: /xsetwarp export <filename> [identifier]"
usage-import: "%prefix%&cUsage: /xsetwarp import <filename|essentials|cmi|all>"
export-success: "%prefix%&aExported &e%count% &awarps to &b%file%"
export-failed: "%prefix%&cFailed to export warps."
import-success: "%prefix%&aImported &e%count% &awarps successfully!"
import-file-not-found: "%prefix%&cFile not found: &b%file%"
import-plugin-not-found: "%prefix%&c%plugin% plugin is not installed."
import-plugin-success: "%prefix%&aImported &e%count% &awarps from %plugin%."

# Global Cooldown
warp-global-cooldown: "%prefix%&cYou must wait &e%seconds%s &cbefore using any warp."

# Per-Warp Cooldown (admin command)
usage-setwarpcooldown: "%prefix%&cUsage: /xsetwarp setwarpcooldown <warp> <seconds|default>"
setwarpcooldown-set: "%prefix%&aWarp '&b%warp%&a' cooldown set to &e%seconds%s."
setwarpcooldown-reset: "%prefix%&aWarp '&b%warp%&a' cooldown reset to global default."
setwarpcooldown-invalid: "%prefix%&cInvalid cooldown value. Use a number >= 0 or 'default'."

# Help additions
help-export: "&b/xsw export <file> [id] &f- Export warps to file"
help-import: "&b/xsw import <file|essentials|cmi|all> &f- Import warps"
help-setwarpcooldown: "&b/xsw setwarpcooldown <warp> <s> &f- Set per-warp cooldown"

# Import All
import-all-no-plugins: "%prefix%&cNo supported warp plugins found on the server."
import-all-result: "%prefix%&aFrom %plugin%: imported &e%count% &awarps."
