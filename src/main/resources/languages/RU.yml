# X-SetWarps Language File
# Вы можете настроить все сообщения здесь.
# Поддерживает цветовые коды (&a, &b и т. д.).

# General Messages
prefix: "&8[&bX-SetWarps&8] &7"
no-permission: "%prefix%&cУ вас нет прав для использования этой команды."
only-players: "%prefix%&cЭту команду могут использовать только игроки."
usage-setwarp: "%prefix%&cИспользование: /setwarp <имя> [описание]"
usage-warp: "%prefix%&cИспользование: /warp <имя>"
usage-delwarp: "%prefix%&cИспользование: /delwarp <имя>"
usage-warpinfo: "%prefix%&cИспользование: /warpinfo <имя>"

# Warp Messages
warp-set: "%prefix%&aВарп '&b%warp%&a' успешно установлен!"
warp-not-found: "%prefix%&cВарп '&b%warp%&c' не существует."
warp-teleport: "%prefix%&aТелепортация на варп: &b%warp%"
warp-deleted: "%prefix%&aВарп '&b%warp%&a' был успешно удален."
world-not-loaded: "%prefix%&cОшибка: Мир '&b%world%&c' не загружен."
reload-success: "%prefix%&aКонфигурация и языки успешно перезагружены!"

# New Feature Messages
warp-cooldown: "%prefix%&cВы должны подождать &e%seconds%s &cперед повторным использованием &b%warp%&c."
warp-delay: "%prefix%&eТелепортация на &b%warp% &eчерез &a%seconds% &eсекунд... Не двигайтесь."
warp-delay-cancelled: "%prefix%&cТелепортация отменена из-за движения."
warps-limit-reached: "%prefix%&cДостигнут максимальный лимит варпов (&e%limit%&c)."
warps-list-empty: "%prefix%&cВ данный момент варпы не зарегистрированы."
warps-list-header: "&9&l--- Список варпов (&b%count%&9) ---"
warps-list-entry: "&7- &b%warp% &8(&7World: &f%world%&8) &7- &f%desc%"

# WarpInfo Messages
warpinfo-header: "&9&l--- Информация о варпе: &b%warp% &9&l---"
warpinfo-desc: "&7Описание: &f%desc%"
warpinfo-world: "&7Мир: &f%world%"
warpinfo-coords: "&7Координаты: &f%coords%"
warpinfo-creator: "&7Создатель: &f%creator%"
warpinfo-created: "&7Дата: &f%date%"

# Update Checker Messages
update-check: "%prefix%&eПроверка обновлений..."
update-available: "%prefix%&eДоступна новая версия! &7(&c%current%&7 -> &a%latest%&7)"
update-download: "%prefix%&eСкачать: &b%url%"
update-current: "%prefix%&aВы используете последнюю версию!"
update-error: "%prefix%&cОшибка при проверке обновлений. Попробуйте позже."
version-info: "%prefix%&bВерсия X-SetWarps: &a%version%"

# Help Messages
help-header: "&9&l--- Помощь X-SetWarps ---"
help-reload: "&b/xsw reload &f- Перезагрузить плагин"
help-update: "&b/xsw update &f- Проверить обновления"
help-version: "&b/xsw version &f- Показать версию"
help-setwarp: "&b/setwarp <имя> [опис] &f- Создать варп"
help-warp: "&b/warp <имя> &f- Телепортироваться на варп"
help-delwarp: "&b/delwarp <имя> &f- Удалить варп"
help-warps: "&b/warps &f- Список варпов"
help-warpinfo: "&b/warpinfo <имя> &f- Подробная информация"

# Сообщения языка
language-changed: "%prefix%&aЯзык изменен на: &b%language%"
language-not-found: "%prefix%&cЯзык не найден. Доступные: %list%"
language-list: "&aДоступные: &f%list%"

# Команда Locate
help-locate: "&b/xsw locate <язык> &f- Сменить язык"

# Экспорт/Импорт
usage-export: "%prefix%&cИспользование: /xsetwarp export <файл> [идентификатор]"
usage-import: "%prefix%&cИспользование: /xsetwarp import <файл|essentials|cmi|all>"
export-success: "%prefix%&aЭкспортировано &e%count% &aварпов в &b%file%"
export-failed: "%prefix%&cОшибка экспорта варпов."
import-success: "%prefix%&aИмпортировано &e%count% &aварпов!"
import-file-not-found: "%prefix%&cФайл не найден: &b%file%"
import-plugin-not-found: "%prefix%&cПлагин %plugin% не установлен."
import-plugin-success: "%prefix%&aИмпортировано &e%count% &aварпов из %plugin%."

# Глобальный кулдаун
warp-global-cooldown: "%prefix%&cПодождите &e%seconds%с. &cперед использованием любого варпа."

# Кулдаун варпа (команда админа)
usage-setwarpcooldown: "%prefix%&cИспользование: /xsetwarp setwarpcooldown <варп> <секунды|default>"
setwarpcooldown-set: "%prefix%&aКулдаун варпа '&b%warp%&a' установлен на &e%seconds%с."
setwarpcooldown-reset: "%prefix%&aКулдаун варпа '&b%warp%&a' сброшен на глобальное значение."
setwarpcooldown-invalid: "%prefix%&cНеверное значение. Используйте число >= 0 или 'default'."

# Дополнительная помощь
help-export: "&b/xsw export <file> [id] &f- Экспорт варпов"
help-import: "&b/xsw import <file|essentials|cmi|all> &f- Импорт варпов"
help-setwarpcooldown: "&b/xsw setwarpcooldown <warp> <s> &f- Кулдаун варпа"

# Импорт всех
import-all-no-plugins: "%prefix%&cСовместимые плагины варпов не найдены."
import-all-result: "%prefix%&aИз %plugin%: импортировано &e%count% &aварпов."
