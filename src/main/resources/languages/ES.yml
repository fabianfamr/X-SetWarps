# X-SetWarps Language File
# You can customize all messages here.
# Supports color codes (&a, &b, etc.).

# General Messages
prefix: "&8[&bX-SetWarps&8] &7"
no-permission: "%prefix%&cNo tienes permiso para usar este comando."
only-players: "%prefix%&cEste comando solo puede ser usado por jugadores."
usage-setwarp: "%prefix%&cUso: /setwarp <nombre> [descripción]"
usage-warp: "%prefix%&cUso: /warp <nombre>"
usage-delwarp: "%prefix%&cUso: /delwarp <nombre>"
usage-warpinfo: "%prefix%&cUso: /warpinfo <nombre>"

# Warp Messages
warp-set: "%prefix%&a¡El warp '&b%warp%&a' ha sido creado correctamente!"
warp-not-found: "%prefix%&cEl warp '&b%warp%&c' no existe."
warp-teleport: "%prefix%&aTeletransportado al warp: &b%warp%"
warp-deleted: "%prefix%&aEl warp '&b%warp%&a' ha sido eliminado."
world-not-loaded: "%prefix%&cError: El mundo '&b%world%&c' no está cargado."
reload-success: "%prefix%&a¡Configuración e idiomas recargados correctamente!"

# New Feature Messages
warp-cooldown: "%prefix%&cDebes esperar &e%seconds%s &cpara volver a usar el warp &b%warp%&c."
warp-delay: "%prefix%&eTeletransportando a &b%warp% &een &a%seconds% &esegundos... No te muevas."
warp-delay-cancelled: "%prefix%&cTeletransporte cancelado por movimiento."
warps-limit-reached: "%prefix%&cSe ha alcanzado el límite máximo de warps (&e%limit%&c)."
warps-list-empty: "%prefix%&cNo hay warps registrados actualmente."
warps-list-header: "&9&l--- Lista de Warps (&b%count%&9) ---"
warps-list-entry: "&7- &b%warp% &8(&7Mundo: &f%world%&8) &7- &f%desc%"

# WarpInfo Messages
warpinfo-header: "&9&l--- Información del Warp: &b%warp% &9&l---"
warpinfo-desc: "&7Descripción: &f%desc%"
warpinfo-world: "&7Mundo: &f%world%"
warpinfo-coords: "&7Coordenadas: &f%coords%"
warpinfo-creator: "&7Creado por: &f%creator%"
warpinfo-created: "&7Fecha: &f%date%"

# Update Checker Messages
update-check: "%prefix%&eBuscando actualizaciones..."
update-available: "%prefix%&e¡Nueva versión disponible! &7(&c%current%&7 -> &a%latest%&7)"
update-download: "%prefix%&eDescargar: &b%url%"
update-current: "%prefix%&a¡Estás usando la última versión!"
update-error: "%prefix%&cError al buscar actualizaciones. Inténtalo más tarde."
version-info: "%prefix%&bVersión de X-SetWarps: &a%version%"

# Help Messages
help-header: "&9&l--- Ayuda de X-SetWarps ---"
help-reload: "&b/xsw reload &f- Recarga el plugin"
help-update: "&b/xsw update &f- Busca actualizaciones"
help-version: "&b/xsw version &f- Muestra la versión del plugin"
help-setwarp: "&b/setwarp <nombre> [desc] &f- Crea un warp"
help-warp: "&b/warp <nombre> &f- Teletranspórtate a un warp"
help-delwarp: "&b/delwarp <nombre> &f- Elimina un warp"
help-warps: "&b/warps &f- Lista los warps"
help-warpinfo: "&b/warpinfo <nombre> &f- Información de un warp"
