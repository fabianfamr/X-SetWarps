# X-SetWarps Language File
# Você pode personalizar todas as mensagens aqui.
# Suporta códigos de cores (&a, &b, etc.).

# General Messages
prefix: "&8[&bX-SetWarps&8] &7"
no-permission: "%prefix%&cVocê não tem permissão para usar este comando."
only-players: "%prefix%&cApenas jogadores podem usar este comando."
