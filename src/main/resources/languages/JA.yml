update-current: "%prefix%&a最新バージョンを使用しています！"
update-error: "%prefix%&cアップデートの確認中にエラーが発生しました。後でもう一度お試しください。"
version-info: "%prefix%&bX-SetWarps バージョン: &a%version%"

# Help Messages
help-header: "&9&l--- X-SetWarps ヘルプ ---"
help-reload: "&b/xsw reload &f- プラグインをリロード"
help-update: "&b/xsw update &f- アップデートを確認"
help-version: "&b/xsw version &f- バージョンを表示"
help-setwarp: "&b/setwarp <名前> [説明] &f- ワープを作成"
help-warp: "&b/warp <名前> &f- ワープにテレポート"
help-delwarp: "&b/delwarp <名前> &f- ワープを削除"
help-warps: "&b/warps &f- ワープリストを表示"
help-warpinfo: "&b/warpinfo <名前> &f- 詳細情報を表示"

# 言語メッセージ
language-changed: "%prefix%&a言語を &b%language% &aに変更しました。"
language-not-found: "%prefix%&c言語が見つかりません。選択: %list%"
