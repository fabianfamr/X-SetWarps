world-not-loaded: "%prefix%&cエラー：ワールド '&b%world%&c' がロードされていません。"
reload-success: "%prefix%&a設定と言語が正常にリロードされました！"

# New Feature Messages
warp-cooldown: "%prefix%&cワープを使用するには &e%seconds%秒 &c待つ必要があります。"
warp-delay: "%prefix%&b%warp% &eへテレポート中... &a%seconds%秒 &e待ってください。動かないでください。"
warp-delay-cancelled: "%prefix%&c移動したため、テレポートがキャンセルされました。"
warps-limit-reached: "%prefix%&cワープの最大制限に達しました (&e%limit%&c)。"
warps-list-empty: "%prefix%&c現在、登録されているワープはありません。"
warps-list-header: "&9&l--- ワープリスト (&b%count%&9) ---"
warps-list-entry: "&7- &b%warp% &8(&7World: &f%world%&8) &7- &f%desc%"

# WarpInfo Messages
warpinfo-header: "&9&l--- ワープ情報: &b%warp% &9&l---"
warpinfo-desc: "&7説明: &f%desc%"
warpinfo-world: "&7ワールド: &f%world%"
warpinfo-coords: "&7座標: &f%coords%"
warpinfo-creator: "&7作成者: &f%creator%"
warpinfo-created: "&7作成日: &f%date%"

# Update Checker Messages
update-check: "%prefix%&eアップデートを確認中..."
update-available: "%prefix%&e新しいバージョンが利用可能です！ &7(&c%current%&7 -> &a%latest%&7)"
