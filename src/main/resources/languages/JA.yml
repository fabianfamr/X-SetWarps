# グローバルクールダウン
warp-global-cooldown: "%prefix%&c&e%seconds%秒 &c待ってからワープを使用してください。"

# ワープ毎のクールダウン（管理者コマンド）
usage-setwarpcooldown: "%prefix%&c使用法: /xsetwarp setwarpcooldown <ワープ> <秒数|default>"
setwarpcooldown-set: "%prefix%&aワープ '&b%warp%&a' のクールダウンを &e%seconds%秒 &aに設定しました。"
setwarpcooldown-reset: "%prefix%&aワープ '&b%warp%&a' のクールダウンをデフォルトに戻しました。"
setwarpcooldown-invalid: "%prefix%&c無効な値です。0以上の数字または 'default' を使用してください。"

# ヘルプ追加
help-export: "&b/xsw export <file> [id] &f- ワープをエクスポート"
help-import: "&b/xsw import <file|essentials|cmi|all> &f- ワープをインポート"
help-setwarpcooldown: "&b/xsw setwarpcooldown <warp> <s> &f- ワープ毎のクールダウン"

# 全てインポート
import-all-no-plugins: "%prefix%&c対応するワーププラグインが見つかりません。"
import-all-result: "%prefix%&a%plugin% から: &e%count% &aワープをインポートしました。"
