# Locateコマンド
help-locate: "&b/xsw locate <言語> &f- 言語を変更"

# エクスポート/インポートメッセージ
usage-export: "%prefix%&c使用法: /xsetwarp export <ファイル> [識別子]"
usage-import: "%prefix%&c使用法: /xsetwarp import <file|essentials|cmi|all>"
