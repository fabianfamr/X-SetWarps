# X-SetWarps Language File
# ここでメッセージをカスタマイズできます。
# カラーコード (&a, &b など) をサポートしています。

# General Messages
prefix: "&8[&bX-SetWarps&8] &7"
no-permission: "%prefix%&cこのコマンドを使用する権限がありません。"
only-players: "%prefix%&cこのコマンドはプレイヤーのみが使用できます。"
usage-setwarp: "%prefix%&c使用法: /setwarp <名前> [説明]"
usage-warp: "%prefix%&c使用法: /warp <名前>"
usage-delwarp: "%prefix%&c使用法: /delwarp <名前>"
usage-warpinfo: "%prefix%&c使用法: /warpinfo <名前>"

# Warp Messages
warp-set: "%prefix%&aワープ '&b%warp%&a' が正常に設定されました！"
warp-not-found: "%prefix%&cワープ '&b%warp%&c' は存在しません。"
warp-teleport: "%prefix%&aワープ &b%warp% &aにテレポートしました。"
